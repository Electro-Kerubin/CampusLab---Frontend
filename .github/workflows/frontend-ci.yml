name: Frontend CI

# Se ejecuta en cada push a las ramas de trabajo y en cada Pull Request hacia ellas.
on:
  push:
    branches: [main, dev, test]
  pull_request:
    branches: [main, dev, test]

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior (ahorra minutos de CI).
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, pruebas unitarias y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # Angular 21 requiere Node ^20.19, ^22.12 o >=24.
      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (exactas, desde package-lock.json)
        run: npm ci

      - name: Lint (ESLint + angular-eslint)
        run: npm run lint

      # Karma + Jasmine en Chrome headless (ubuntu-latest ya trae Google Chrome).
      # Falla si alguna prueba falla o si la cobertura baja del umbral de karma.conf.js.
      - name: Pruebas unitarias con cobertura
        run: npm run test:ci

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/campuslab/
          if-no-files-found: warn

      - name: Build de producción
        run: npm run build

      - name: Publicar build (dist/campuslab/browser)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/campuslab/browser/
